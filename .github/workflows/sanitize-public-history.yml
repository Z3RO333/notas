name: Sanitize public history

on:
  push:
    paths:
      - '.github/workflows/sanitize-public-history.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove internal documentation from git history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git filter-branch --force \
            --index-filter 'git rm -r --cached --ignore-unmatch docs/plans docs/superpowers docs/CONTEXTO_SISTEMA.md docs/RUNBOOK.md' \
            --prune-empty \
            --tag-name-filter cat \
            -- --all
          git push origin --force --all
          git push origin --force --tags
